<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
body{font-family:Segoe UI,sans-serif;background:#1a1a2e;color:#e0e0e0;padding:40px;}
.container{max-width:600px;margin:auto;background:#16213e;border-radius:12px;padding:32px;border:1px solid rgba(255,255,255,0.08);}
h1{color:#4ade80;font-size:24px;}
p{color:#8892b0;line-height:1.6;}
.detail{background:#1a2744;border-radius:8px;padding:16px;margin:16px 0;}
.label{color:#8892b0;font-size:12px;}
.value{color:#e0e0e0;font-weight:600;font-size:16px;}
.footer{font-size:12px;color:#555;margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08);}
</style></head>
<body>
<div class="container">
<h1>Transaction approuvée ✅</h1>
<p>Bonjour <strong>{{ user_name }}</strong>,</p>
<p>Votre transaction a été approuvée.</p>
<div class="detail">
<div class="label">Description</div>
<div class="value">{{ description }}</div>
<div class="label" style="margin-top:12px;">Montant</div>
<div class="value">{{ amount }} TND</div>
</div>
<div class="footer">
BudgetCollab &mdash; Gérez vos budgets en équipe
</div>
</div>
</body>
</html>
