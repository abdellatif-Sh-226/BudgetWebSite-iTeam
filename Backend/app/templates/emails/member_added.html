<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
body{font-family:Segoe UI,sans-serif;background:#1a1a2e;color:#e0e0e0;padding:40px;}
.container{max-width:600px;margin:auto;background:#16213e;border-radius:12px;padding:32px;border:1px solid rgba(255,255,255,0.08);}
h1{color:#4ade80;font-size:24px;}
p{color:#8892b0;line-height:1.6;}
.btn{display:inline-block;padding:12px 24px;background:#e94560;color:#fff;text-decoration:none;border-radius:8px;margin:16px 0;}
.footer{font-size:12px;color:#555;margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08);}
</style></head>
<body>
<div class="container">
<h1>Vous avez été ajouté à un budget partagé 🎉</h1>
<p>Bonjour,</p>
<p><strong>{{ added_by }}</strong> vous a ajouté au budget partagé <strong>{{ shared_budget_name }}</strong>.</p>
<p>Vous pouvez maintenant collaborer et suivre les dépenses ensemble.</p>
<a class="btn" href="http://localhost:5173">Voir le budget</a>
<div class="footer">
BudgetCollab &mdash; Gérez vos budgets en équipe
</div>
</div>
</body>
</html>
