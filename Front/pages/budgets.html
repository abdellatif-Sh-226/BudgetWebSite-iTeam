<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="budgets">Budgets - BudgetCollab</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-logo">💰 <span data-translate="appTitle">BudgetCollab</span></div>
    <div class="sidebar-user">
      <div class="avatar" id="sidebarAvatar">A</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebarName">Admin</div>
        <div id="sidebarRoleBadge"></div>
      </div>
    </div>
    <nav class="nav" id="sidebarNav">
      <div class="nav-item" onclick="navigateTo('dashboard')">
        <span class="nav-icon">📊</span><span data-translate="dashboard">Tableau de bord</span>
      </div>
      <div class="nav-item" onclick="navigateTo('transactions')">
        <span class="nav-icon">💳</span><span data-translate="transactions">Transactions</span>
      </div>
      <div class="nav-item active" onclick="navigateTo('budgets')">
        <span class="nav-icon">📈</span><span data-translate="budgets">Budgets</span>
      </div>
      <div class="nav-item" onclick="navigateTo('categories')">
        <span class="nav-icon">🏷️</span><span data-translate="categories">Catégories</span>
      </div>
      <div class="nav-item" onclick="navigateTo('profile')">
        <span class="nav-icon">👤</span><span data-translate="profile">Profil</span>
      </div>
      <div class="nav-item" onclick="navigateTo('shared')">
        <span class="nav-icon">🤝</span><span data-translate="shared">Partagés</span>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <div class="nav-item" onclick="doLogout()">
        <span class="nav-icon">🚪</span><span data-translate="logout">Déconnexion</span>
      </div>
    </div>
  </div>

  <main class="main">
    <div class="page active" id="budgetsPage">
      <div class="page-header">
        <div>
          <div class="page-title" data-translate="budgets">Budgets</div>
          <div class="page-subtitle">Gérez vos budgets et objectifs financiers</div>
        </div>
        <button class="btn" onclick="openBudgetModal()" data-translate="addBudget">Créer un budget</button>
      </div>

      <div class="section">
        <div class="budgets-grid" id="budgetsGrid"></div>
        <div class="empty-state" id="noBudgets" data-translate="noBudgets">Aucun budget créé</div>
      </div>
    </div>
  </main>
</div>

<!-- Budget Modal -->
<div class="modal-overlay" id="budgetModal">
  <div class="modal">
    <div class="modal-title" data-translate="addBudget">Créer un budget</div>
    <div class="form-group">
      <label data-translate="budgetName">Nom du budget</label>
      <input type="text" id="budgetName" placeholder="Ex: Alimentation, Transport...">
    </div>
    <div class="form-group">
      <label data-translate="budgetLimit">Limite (TND)</label>
      <input type="number" id="budgetLimit" placeholder="0.00" min="0" step="0.01">
    </div>
    <div class="form-group">
      <label data-translate="category">Catégorie (optionnel)</label>
      <select id="budgetCat">
        <option value="">Toutes catégories</option>
      </select>
    </div>
    <div class="form-group">
      <label data-translate="period">Période</label>
      <select id="budgetPeriod">
        <option value="monthly">Mensuel</option>
        <option value="weekly">Hebdomadaire</option>
        <option value="yearly">Annuel</option>
      </select>
    </div>
    <div class="form-group">
      <label data-translate="notes">Notes (optionnel)</label>
      <textarea id="budgetNotes" rows="2" placeholder="..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('budgetModal')" data-translate="cancel">Annuler</button>
      <button class="btn" onclick="saveBudget()" data-translate="save">Enregistrer</button>
    </div>
  </div>
</div>

<script src="../js/languages.js"></script>
<script src="../js/db.js"></script>
<script src="../js/budgets.js"></script>
<script>
// Navigation function
function navigateTo(page) {
  window.location.href = `${page}.html`;
}

// Check authentication
if (!getCurrentUser()) {
  window.location.href = 'login.html';
} else {
  CU = getCurrentUser();
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', () => {
  updateUI();
  loadBudgets();
});
</script>
</body>
</html>
