<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetCollab - Dashboard</title>
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/sidebar.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div id="app" class="app-shell">
    <aside id="sidebarRoot"></aside>
    <main class="main-content">
        <div class="page-header">
            <div>
                <div class="page-title">Tableau de bord</div>
                <div class="page-subtitle" id="dashDate"></div>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
                <span id="dashRoleInfo"></span>
                <button class="btn btn-secondary btn-sm" onclick="openProfileModal()">✏️ Mon profil</button>
            </div>
        </div>
        <div id="dashAlerts"></div>
        <div class="cards-grid" id="dashCards"></div>
        <div class="two-col">
            <div class="section">
                <div class="section-title" style="margin-bottom:16px">Répartition des dépenses</div>
                <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
            </div>
            <div class="section">
                <div class="section-title" style="margin-bottom:16px">Évolution mensuelle</div>
                <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
            </div>
        </div>
        <div class="section">
            <div class="section-header">
                <span class="section-title">Transactions récentes</span>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Catégorie</th>
                        <th id="userHeader" style="display:none">Utilisateur</th>
                        <th>Montant</th>
                    </tr>
                </thead>
                <tbody id="dashTxBody"></tbody>
            </table>
        </div>
    </main>
</div>

<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <div class="modal-title">✏️ Modifier mon profil</div>
    <div class="form-group"><label>Nom complet</label><input type="text" id="profName"></div>
    <div class="form-group"><label>Email</label><input type="email" id="profEmail"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('profileModal')">Annuler</button>
      <button class="btn" onclick="saveProfile()">Enregistrer</button>
    </div>
    <div id="profMsg" style="font-size:13px;margin-top:12px;text-align:center;min-height:18px"></div>
  </div>
</div>

<script src="../languages/en.js"></script>
<script src="../languages/fr.js"></script>
<script type="module">
    import { createSidebar, setSidebarLanguage } from "../components/sidebar.js";
    setSidebarLanguage('fr');
    const sidebarRoot = document.getElementById('sidebarRoot');
    if (sidebarRoot) sidebarRoot.appendChild(createSidebar());
</script>
<script type="module" src="../js/dashboard.js"></script>
</body>
</html>
