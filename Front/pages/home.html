<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetCollab - Connexion</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0;}
      body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
      .auth-box{background:#16213e;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:40px;width:380px;max-width:90vw;}
      .auth-logo{font-size:28px;font-weight:700;color:#e94560;margin-bottom:8px;}
      .auth-sub{color:#8892b0;font-size:14px;margin-bottom:28px;}
      .form-group{margin-bottom:16px;}
      .form-group label{display:block;font-size:13px;color:#8892b0;margin-bottom:6px;}
      .form-group input{width:100%;padding:11px 14px;background:#1a1a2e;border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#e0e0e0;font-size:14px;outline:none;transition:border .2s;}
      .form-group input:focus{border-color:#e94560;}
      .btn{width:100%;padding:12px;background:#e94560;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s;}
      .btn:hover{opacity:.9;}
      .err{font-size:13px;margin-top:12px;text-align:center;color:#f87171;min-height:18px;}
      .demo-accounts{margin-top:24px;padding:16px;background:rgba(255,255,255,0.04);border-radius:12px;font-size:13px;color:#8892b0;}
      .demo-title{font-weight:600;margin-bottom:8px;color:#e0e0e0;}
      .demo-accounts strong{color:#e0e0e0;}
    </style>
</head>
<body>
<div class="auth-box">
    <div class="auth-logo">💰 BudgetCollab</div>
    <div class="auth-sub">Connectez-vous pour gérer vos budgets</div>
    <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="vous@exemple.com"></div>
    <div class="form-group"><label>Mot de passe</label><input type="password" id="loginPwd" placeholder="••••••••"></div>
    <button class="btn" onclick="doLogin()">Se connecter</button>
    <div class="err" id="authErr"></div>
    <div class="demo-accounts">
        <div class="demo-title">Comptes de démonstration :</div>
        <div>👑 Admin : <strong>admin@demo.com</strong> / <strong>admin123</strong></div>
        <div>👤 User : <strong>sara@demo.com</strong> / <strong>sara123</strong></div>
    </div>
</div>

<script src="../languages/en.js"></script>
<script src="../languages/fr.js"></script>
<script>
const CU = null;

function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pwd = document.getElementById('loginPwd').value;
    const err = document.getElementById('authErr');
    
    if (!email || !pwd) {
        err.textContent = 'Email et mot de passe requis.';
        return;
    }
    
    const users = [
        { id: '1', name: 'Admin', email: 'admin@demo.com', pwd: 'admin123', role: 'admin' },
        { id: '2', name: 'Sara', email: 'sara@demo.com', pwd: 'sara123', role: 'user' }
    ];
    
    const user = users.find(u => u.email === email && u.pwd === pwd);
    if (!user) {
        err.textContent = 'Email ou mot de passe incorrect.';
        return;
    }
    
    window.CU = { id: user.id, name: user.name, role: user.role };
    sessionStorage.setItem('budgetcollab_user', JSON.stringify(window.CU));
    window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
