<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="shared">Partagés - BudgetCollab</title>
  <link rel="stylesheet" href="../css/colors.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-logo">💰 <span data-translate="appTitle">BudgetCollab</span></div>
    <div class="sidebar-user">
      <div class="avatar" id="sidebarAvatar">A</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebarName">Admin</div>
        <div id="sidebarRoleBadge"></div>
      </div>
    </div>
    <nav class="nav" id="sidebarNav">
      <div class="nav-item" onclick="navigateTo('dashboard')">
        <span class="nav-icon">📊</span><span data-translate="dashboard">Tableau de bord</span>
      </div>
      <div class="nav-item" onclick="navigateTo('transactions')">
        <span class="nav-icon">💳</span><span data-translate="transactions">Transactions</span>
      </div>
      <div class="nav-item" onclick="navigateTo('budgets')">
        <span class="nav-icon">📈</span><span data-translate="budgets">Budgets</span>
      </div>
      <div class="nav-item" onclick="navigateTo('categories')">
        <span class="nav-icon">🏷️</span><span data-translate="categories">Catégories</span>
      </div>
      <div class="nav-item" onclick="navigateTo('profile')">
        <span class="nav-icon">👤</span><span data-translate="profile">Profil</span>
      </div>
      <div class="nav-item active" onclick="navigateTo('shared')">
        <span class="nav-icon">🤝</span><span data-translate="shared">Partagés</span>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <div class="lang-switcher" style="margin-bottom: 12px;">
        <button class="lang-btn" id="btnLangFR" onclick="setLanguage('fr')">FR</button>
        <button class="lang-btn" id="btnLangEN" onclick="setLanguage('en')">EN</button>
      </div>
      <div class="nav-item" onclick="doLogout()">
        <span class="nav-icon">🚪</span><span data-translate="logout">Déconnexion</span>
      </div>
    </div>
  </div>

  <main class="main">
    <div class="page active" id="sharedPage">
      <div class="page-header">
        <div>
          <div class="page-title" data-translate="shared">Partagés</div>
          <div class="page-subtitle">Gérez vos budgets partagés avec d'autres utilisateurs</div>
        </div>
        <button class="btn" onclick="openSharedModal()" data-translate="createShared">Créer un budget partagé</button>
      </div>

      <div class="section">
        <div class="shared-grid" id="sharedGrid"></div>
        <div class="empty-state" id="noShared" data-translate="noShared">Aucun budget partagé</div>
      </div>
    </div>
  </main>
</div>

<!-- Shared Modal -->
<div class="modal-overlay" id="sharedModal">
  <div class="modal">
    <div class="modal-title" data-translate="createShared">Créer un budget partagé</div>
    <div class="form-group">
      <label data-translate="sharedName">Nom du budget partagé</label>
      <input type="text" id="sharedName" placeholder="Ex: Budget Famille, Projet Commun...">
    </div>
    <div class="form-group">
      <label data-translate="members">Membres (emails séparés par des virgules)</label>
      <input type="text" id="sharedMembers" placeholder="email1@example.com, email2@example.com">
    </div>
    <div class="form-group">
      <label data-translate="description">Description</label>
      <textarea id="sharedDesc" rows="2" placeholder="..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('sharedModal')" data-translate="cancel">Annuler</button>
      <button class="btn" onclick="saveShared()" data-translate="save">Créer</button>
    </div>
  </div>
</div>

<script src="../js/lang/fr.js"></script>
<script src="../js/lang/en.js"></script>
<script src="../js/languages.js"></script>
<script src="../js/db.js"></script>
<script src="../js/shared.js"></script>
<script>
// Navigation function
function navigateTo(page) {
  window.location.href = `${page}.html`;
}

// Check authentication
if (!getCurrentUser()) {
  window.location.href = 'login.html';
} else {
  CU = getCurrentUser();
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', () => {
  updateUI();
  loadShared();
});
</script>
</body>
</html>
